name: August Home
description: >-
  August Home is a consumer smart-home and access-control brand best known for its
  retrofit August Smart Lock, Smart Lock Pro, Wi-Fi Smart Lock, Smart Keypad, Doorbell
  Cam, and the August Connect Wi-Fi Bridge. Founded in San Francisco and acquired by
  ASSA ABLOY, August products are now sold and supported alongside the Yale Home brand
  and operated through the shared Yale Access mobile app. August does not publish a
  public developer API or developer portal; programmatic access to August locks is
  reached through the private mobile/app API or via third-party universal-access
  platforms such as Seam, and integrations exist with Google Home, Amazon Alexa, Apple
  HomeKit, Airbnb, and Yale. This profile was surfaced as a portfolio company of Cowboy
  Ventures and enriched from public sources.
